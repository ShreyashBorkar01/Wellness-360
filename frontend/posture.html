<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posture Gesture Coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* General Layout */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #1e293b 70%);
      color: #e2e8f0;
      overflow: hidden;
    }

    /* Header */
    h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      letter-spacing: 1px;
      color: #06b6d4;
      text-shadow: 0 2px 10px rgba(6, 182, 212, 0.4);
      animation: fadeDown 1s ease;
    }

    /* Button Container */
    .btn-container {
      display: flex;
      flex-direction: row;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Buttons */
    .btn-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      width: 200px;
      height: 160px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .btn-card:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: #06b6d4;
      box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3);
    }

    .btn-card h2 {
      margin: 10px 0 0;
      font-size: 1.1rem;
      color: #06b6d4;
      font-weight: 600;
    }

    .btn-icon {
      font-size: 2.5rem;
      color: #67e8f9;
    }

    /* Floating Particles Animation */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(6, 182, 212, 0.3);
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(-20px); opacity: 1; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <h1>Posture Gesture Coach</h1>

  <div class="btn-container">
    <div class="btn-card" onclick="openPage('bicep.html')">
      <div class="btn-icon">💪</div>
      <h2>Bicep Tracker</h2>
    </div>
    <div class="btn-card" onclick="openPage('squat.html')">
      <div class="btn-icon">🏋️</div>
      <h2>Squat Tracker</h2>
    </div>
    <div class="btn-card" onclick="openPage('pushup.html')">
      <div class="btn-icon">🧘</div>
      <h2>Posture Analysis</h2>
    </div>
  </div>

  <!-- Floating Glow Particles -->
  <div class="particle" style="width:20px;height:20px;top:10%;left:15%;animation-delay:0s;"></div>
  <div class="particle" style="width:15px;height:15px;top:60%;left:70%;animation-delay:2s;"></div>
  <div class="particle" style="width:25px;height:25px;top:80%;left:30%;animation-delay:4s;"></div>

  <script>
    function openPage(pageName) {
      window.open(pageName, "_blank");
    }
  </script>
</body>
</html>
