<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Smartwatch Dashboard + BLE Debug + CSV Export</title>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body{font-family:Inter,Segoe UI,Arial; background:#f6f8fa; color:#111; margin:0;padding:0}
  header{background:#d32f2f;padding:20px;color:white;font-size:24px;font-weight:bold;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,0.2)}
  button{padding:10px 16px;margin:8px;border-radius:8px;border:0;background:#0b6fa4;color:white;cursor:pointer}
  button.secondary{background:#6c757d}
  #status{margin:10px;font-weight:bold}
  .dashboard{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;margin:20px auto;max-width:1200px}
  .card{background:white;padding:20px;border-radius:15px;box-shadow:0 6px 12px rgba(0,0,0,0.1);width:220px;text-align:center}
  .value{font-size:28px;font-weight:bold;margin-top:10px}
  .alert{margin-top:10px;font-weight:bold}
  .alert.ok{color:green}.alert.warn{color:orange}.alert.danger{color:red}
  #debug{padding:20px}
  pre#log{background:#0b1b2b;color:#e6f7ff;padding:12px;border-radius:8px;max-height:250px;overflow:auto;font-size:13px}
  .service{background:white;padding:10px;border-radius:10px;box-shadow:0 2px 6px rgba(10,10,10,0.05);margin-bottom:10px}
  .char-row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .uuid{font-family:monospace;background:#eef6fb;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
  <header>⏱ boAt Fitness Dashboard + BLE Debugger + CSV Export</header>

  <div style="text-align:center">
    <button id="connectBtn">🔗 Connect to Smartwatch</button>
    <button id="btnDisconnect" class="secondary" disabled>⛔ Disconnect</button>
    <button id="btnDownloadCSV">📥 Download CSV</button>
    <div id="status">Status: Not connected</div>
  </div>

  <!-- Fitness Dashboard -->
  <div class="dashboard">
    <div class="card"><h3>❤ Heart Rate</h3><div class="value" id="heartRate">-- bpm</div><div class="alert" id="hrAlert">--</div></div>
    <div class="card"><h3>👟 Steps</h3><div class="value" id="steps">--</div><div class="alert" id="stepsAlert">--</div></div>
    <div class="card"><h3>🔋 Battery</h3><div class="value" id="battery">-- %</div><div class="alert" id="batteryAlert">--</div></div>
    <div class="card"><h3>🩸 SpO₂</h3><div class="value" id="spo2">-- %</div><div class="alert" id="spo2Alert">--</div></div>
    <div class="card"><h3>😴 Sleep</h3><div class="value" id="sleep">-- hrs</div><div class="alert" id="sleepAlert">--</div></div>
  </div>

  <canvas id="mainChart" width="700" height="350"></canvas>

  <!-- Debug Panel -->
  <div id="debug">
    <h3>🔍 BLE Debug Log</h3>
    <div id="services"></div>
    <pre id="log">No data yet. Connect to device and start notifications or reads.</pre>
  </div>

<script>
/* ---------------------------
   Chart.js setup
--------------------------- */
let labels = [], hrData = [], stepsData = [], spo2Data = [];
const ctx = document.getElementById('mainChart').getContext('2d');
const mainChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {label:'Heart Rate (bpm)',data:hrData,borderColor:'#d32f2f',backgroundColor:'rgba(211,47,47,0.2)',fill:true,tension:0.3,yAxisID:'y'},
      {label:'Steps',data:stepsData,borderColor:'#1976d2',backgroundColor:'rgba(25,118,210,0.2)',fill:true,tension:0.3,yAxisID:'y1'},
      {label:'SpO₂ (%)',data:spo2Data,borderColor:'#388e3c',backgroundColor:'rgba(56,142,60,0.2)',fill:true,tension:0.3,yAxisID:'y'}
    ]
  },
  options:{responsive:true,interaction:{mode:'index',intersect:false},stacked:false,
    scales:{y:{type:'linear',position:'left',beginAtZero:true},y1:{type:'linear',position:'right',beginAtZero:true}}
  }
});
function updateChart(hr,steps,spo2){
  const now = new Date().toLocaleTimeString();
  labels.push(now);
  hrData.push(hr!==null?hr:(hrData.length?hrData[hrData.length-1]:0));
  stepsData.push(steps!==null?steps:(stepsData.length?stepsData[stepsData.length-1]:0));
  spo2Data.push(spo2!==null?spo2:(spo2Data.length?spo2Data[spo2Data.length-1]:0));
  if(labels.length>20){labels.shift();hrData.shift();stepsData.shift();spo2Data.shift();}
  mainChart.update();
}

/* ---------------------------
   BLE Debug + Device Connect
--------------------------- */
let g_device=null,g_server=null;
const logs=[];
function appendLog(text){
  const ts=new Date().toLocaleTimeString();
  logs.push(`[${ts}] ${text}`);
  document.getElementById('log').textContent=logs.join('\n');
  const p = document.getElementById('log');
  p.scrollTop = p.scrollHeight;
}

/* Discover services and characteristics */
async function discoverServicesAndChars(){
  const servicesDiv=document.getElementById('services');
  servicesDiv.innerHTML='';
  try{
    const services=await g_server.getPrimaryServices();
    appendLog(`Found ${services.length} services`);
    for(const svc of services){
      const svcDiv=document.createElement('div');
      svcDiv.className='service';
      svcDiv.innerHTML = `<strong>Service</strong> <span class="uuid">${svc.uuid}</span>`;
      servicesDiv.appendChild(svcDiv);
    }
  }catch(e){
    appendLog('Service discovery error: '+e);
  }
}

/* Connect button */
document.getElementById("connectBtn").addEventListener("click", async ()=>{
  try{
    const device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:['heart_rate','battery_service','device_information']
    });
    g_device=device;
    g_server = await device.gatt.connect();
    document.getElementById("status").innerText="✅ Connected to "+(device.name||'Unknown');
    appendLog("Connected to "+(device.name||'Unknown'));
    document.getElementById("btnDisconnect").disabled = false;
    discoverServicesAndChars();

    // Heart rate service
    try{
      const hrService=await g_server.getPrimaryService('heart_rate');
      const hrChar=await hrService.getCharacteristic('heart_rate_measurement');
      await hrChar.startNotifications();
      hrChar.addEventListener('characteristicvaluechanged',ev=>{
        const data=ev.target.value;
        const flags=data.getUint8(0);
        let hr=(flags & 0x01)?data.getUint16(1,true):data.getUint8(1);
        document.getElementById("heartRate").innerText=hr+" bpm";
        const hrAlert=document.getElementById("hrAlert");
        if(hr<50){hrAlert.innerText="⚠ Low";hrAlert.className="alert warn";}
        else if(hr>120){hrAlert.innerText="🚨 High";hrAlert.className="alert danger";}
        else{hrAlert.innerText="✅ Normal";hrAlert.className="alert ok";}
        updateChart(hr,null,null);
      });
    }catch(e){appendLog('Heart rate not found');}

    // Battery
    try{
      const batteryService=await g_server.getPrimaryService('battery_service');
      const batteryChar=await batteryService.getCharacteristic('battery_level');
      const val=await batteryChar.readValue();
      const battery=val.getUint8(0);
      document.getElementById("battery").innerText=battery+" %";
      const alertEl=document.getElementById("batteryAlert");
      if(battery<20){alertEl.innerText="⚠ Low";alertEl.className="alert danger";}
      else{alertEl.innerText="✅ Good";alertEl.className="alert ok";}
    }catch(e){appendLog('Battery service missing');}
  }catch(e){
    appendLog("Connect error: "+e);
  }
});

/* Disconnect */
document.getElementById("btnDisconnect").addEventListener("click",()=>{
  if(g_device && g_device.gatt && g_device.gatt.connected){
    g_device.gatt.disconnect();
    document.getElementById("status").innerText="❌ Disconnected";
    appendLog("Disconnected");
    document.getElementById("btnDisconnect").disabled = true;
  }
});

/* ---------------------------
   CSV Download Function
--------------------------- */
document.getElementById("btnDownloadCSV").addEventListener("click",()=>{
  let csv = "Time,Heart Rate (bpm),Steps,SpO2 (%)\n";
  for(let i=0;i<labels.length;i++){
    csv += `${labels[i]},${hrData[i]},${stepsData[i]},${spo2Data[i]}\n`;
  }
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "fitness_data.csv";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
